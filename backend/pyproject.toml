[project]
name = "meeting-continuity-agent-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test fixture payloads are long JSON-shaped literals by nature; splitting them
# would hurt readability more than a longer line does. conftest.py and
# test_redaction.py intentionally insert the backend root onto sys.path before
# importing backend-local modules, since this project has no installed package.
"tests/**/*.py" = ["E501", "E402"]
# `Depends(...)` as an argument default is FastAPI's documented dependency-
# injection pattern, not the accidental "mutable default" bug B008 targets.
"api/**/*.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
